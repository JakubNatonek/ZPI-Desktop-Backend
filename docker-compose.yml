services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ZPI-Desktop-Backend
    ports:
      - "8000:8000"
  db:
    image: postgres:16
    container_name: zpi-postgres
    environment:
      POSTGRES_DB: zpi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zpi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      
volumes:
  postgres_data: